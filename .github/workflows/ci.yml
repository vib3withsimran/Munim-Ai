name: Munim AI CI Pipeline

on:
  push:
    branches: [ main, simran ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Syntax and Bytecode Compilation Check
        run: |
          python -m compileall backend/app

      - name: Lint check with Ruff
        run: |
          ruff check backend/app --ignore E501,F401,F841

      - name: Verify Webhook & App Initialisation
        env:
          DRY_RUN: "1"
          DATABASE_URL: "sqlite:///./backend/data/munim_ci.db"
          WHATSAPP_PHONE_NUMBER_ID: "mock_phone_id"
          WHATSAPP_ACCESS_TOKEN: "mock_token"
          WHATSAPP_VERIFY_TOKEN: "munim_verify_2026"
        run: |
          python -c "from backend.app.main import app; print('Munim AI initialized cleanly in CI!')"

